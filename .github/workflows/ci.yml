name: CI

# CI strategy adapted from glaciforge/saferefl for slogx:
# - Go version matrix: 1.23 (floor), stable
# - Tests run with race detector
# - Examples are built but excluded from coverage
# - Coverage uploaded via Codecov OIDC when available

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CGO_ENABLED: "1"

jobs:
  build:
    name: Build (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', 'stable']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - run: go mod download
      - run: go mod verify
      - run: go build ./...

      - name: Build examples
        run: |
          for d in examples/*/; do
            echo "==> building $d"
            go build -o /dev/null "./$d"
          done

  test:
    name: Test (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', 'stable']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Tests with race detector
        run: go test -race -count=1 ./...

      - name: Coverage (stable)
        if: matrix.go-version == 'stable'
        run: |
          go list ./... | grep -v '/examples/' | \
            xargs go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic

      - name: Upload coverage to Codecov (stable)
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          name: codecov-slogx-stable
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted files:"
            gofmt -l .
            echo "Run 'go fmt ./...' to fix."
            exit 1
          fi

  examples:
    name: Run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Run all examples
        run: |
          for d in examples/*/; do
            echo "==> running $d"
            go run "./$d"
          done
