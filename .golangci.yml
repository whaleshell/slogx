# GolangCI-Lint v2 configuration for slogx
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - gosec
    - nilnil
    - nilerr
    - ineffassign
    - gocyclo
    - misspell
    - whitespace
    - unconvert
    - unparam
    - revive
    - prealloc
    - goconst
    - gocritic
    - nolintlint
    - nakedret
    - durationcheck

  settings:
    gocyclo:
      min-complexity: 20
    misspell:
      locale: US
    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: exported

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - examples/
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/glaciforge/slogx
